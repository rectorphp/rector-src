name: Rector Drupal with dev-main

on:
    # skip on main; run manually only
    workflow_dispatch:

env:
    # see https://github.com/composer/composer/issues/9368#issuecomment-718112361
    COMPOSER_ROOT_VERSION: "dev-main"

jobs:
    rector_drupal_rector_dev:
        runs-on: ubuntu-latest
        timeout-minutes: 4

        steps:
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

                # fixes https://github.com/rectorphp/rector/pull/4559/checks?check_run_id=1359814403, see https://github.com/shivammathur/setup-php#composer-github-oauth
                env:
                    COMPOSER_TOKEN: ${{ secrets.ACCESS_TOKEN }}

                # use TomasVotruba fork branch with the ParentClassScopeResolver removal fix until merged, see https://github.com/samsonasik/drupal-rector/pull/1
            -   run: git clone --branch tv-drop-parent-class-scope-resolver https://github.com/TomasVotruba/drupal-rector.git

                # drupal-rector pins a stopgap "conflict" against rector >=2.6.2 until it ports to composer-based sets;
                # strip it so dev-main can be smoke-tested here
            -   run: jq 'del(.conflict."rector/rector")' drupal-rector/composer.json > drupal-rector/composer.tmp.json && mv drupal-rector/composer.tmp.json drupal-rector/composer.json

            -   run: composer require rector/rector:dev-main --working-dir drupal-rector
            -   run: cd drupal-rector && vendor/bin/phpunit
