name: Tests

on:
    pull_request: null
    push:
     branches:
        - main



env:
    # see https://github.com/composer/composer/issues/9368#issuecomment-718112361
    COMPOSER_ROOT_VERSION: "dev-main"

jobs:
    tests:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php-versions: ['8.4', '8.5']

        runs-on: ${{ matrix.os }}
        timeout-minutes: 4

        name: PHP ${{ matrix.php-versions }} tests (${{ matrix.os }})
        steps:
            -   uses: actions/checkout@v5

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: none
                    # to display warning when assert() is called, eg: on direct getArgs() on CallLike
                    # and check against first class callable strlen(...)
                    ini-values: zend.assertions=1

            -   uses: "ramsey/composer-install@v4"

            -   run: vendor/bin/phpunit --colors

    # proof of concept: same suite via the Go parallel runner, for an A/B time comparison
    fast_tests:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                php-versions: ['8.4']

        runs-on: ${{ matrix.os }}
        timeout-minutes: 4

        name: PHP ${{ matrix.php-versions }} fast-phpunit (${{ matrix.os }})
        steps:
            -   uses: actions/checkout@v5

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: none
                    ini-values: zend.assertions=1

            -   uses: "ramsey/composer-install@v4"

            -   uses: actions/setup-go@v5
                with:
                    go-version: 'stable'

            -   run: go build -o fast-phpunit .
                working-directory: utils-tests-runner

            # run from repo root so test-dir discovery and phpunit.xml resolve;
            # Go appends .exe to the output name on Windows
            -   run: ./utils-tests-runner/fast-phpunit${{ runner.os == 'Windows' && '.exe' || '' }}
