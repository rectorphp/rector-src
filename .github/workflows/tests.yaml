name: Tests

on:
    pull_request: null
    push:
     branches:
        - main

env:
    # see https://github.com/composer/composer/issues/9368#issuecomment-718112361
    COMPOSER_ROOT_VERSION: "dev-main"

jobs:
    tests:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php-versions: ['8.4', '8.5']

        runs-on: ${{ matrix.os }}
        timeout-minutes: 4

        name: PHP ${{ matrix.php-versions }} tests (${{ matrix.os }})
        steps:
            -   uses: actions/checkout@v5

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: none
                    # to display warning when assert() is called, eg: on direct getArgs() on CallLike
                    # and check against first class callable strlen(...)
                    ini-values: zend.assertions=1

            -   uses: "ramsey/composer-install@v4"

            # load PHPStan Turbo from php.ini, so every PHP process of the test suite has it
            -
                name: Load PHPStan Turbo
                run: |
                    EXTENSION=$(php -r 'require "vendor/autoload.php"; echo PHPStan\Turbo\TurboExtensionSelector::findExtensionForWorkers();')
                    echo "extension=$EXTENSION" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-phpstan-turbo.ini"
                    php -r 'exit(extension_loaded("phpstan_turbo") ? 0 : 1);'

            -   run: vendor/bin/fastunit tests rules-tests utils/phpstan/tests
